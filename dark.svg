<svg viewBox="0 0 1180 340" width="1180" height="340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sainath Erukulla — Software Analyst, Java Backend Engineer">
  <style>
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 17px; }
    .title { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 13px; fill: #64748B; }
    .prompt { fill: #10B981; }
    .cmd { fill: #E2E8F0; }
    .out { fill: #94A3B8; }
    .name { fill: #22D3EE; font-size: 30px; font-weight: 700; letter-spacing: 1px; }
    .accent { fill: #A78BFA; }
    .kw { fill: #22D3EE; }

    @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0% 0 0); } }
    @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    .t1 { animation: type 0.9s steps(18, end) 0.3s both; }
    .o1 { animation: appear 0.01s 1.3s both; }
    .t2 { animation: type 1.0s steps(22, end) 2.0s both; }
    .o2 { animation: appear 0.01s 3.1s both; }
    .t3 { animation: type 0.9s steps(20, end) 3.9s both; }
    .o3 { animation: appear 0.01s 4.9s both; }
    .cursor { animation: blink 1.1s step-end 5.2s infinite; opacity: 0; }

    @media (prefers-reduced-motion: reduce) {
      .t1, .o1, .t2, .o2, .t3, .o3 { animation: none; }
      .cursor { animation: none; opacity: 1; }
    }
  </style>

  <!-- backdrop -->
  <rect width="1180" height="340" fill="#0A101F"/>

  <!-- terminal window -->
  <rect x="24" y="20" width="1132" height="300" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>

  <!-- title bar -->
  <rect x="24" y="20" width="1132" height="40" rx="12" fill="#111C33"/>
  <rect x="24" y="48" width="1132" height="12" fill="#111C33"/>
  <circle cx="52" cy="40" r="6.5" fill="#EF4444"/>
  <circle cx="74" cy="40" r="6.5" fill="#F59E0B"/>
  <circle cx="96" cy="40" r="6.5" fill="#10B981"/>
  <text x="590" y="45" text-anchor="middle" class="title">sainath@erukulla — ~/profile</text>

  <!-- line 1 -->
  <text x="56" y="100" class="mono t1"><tspan class="prompt">➜ ~ </tspan><tspan class="cmd">whoami</tspan></text>
  <text x="56" y="140" class="name o1">SAINATH ERUKULLA</text>

  <!-- line 2 -->
  <text x="56" y="184" class="mono t2"><tspan class="prompt">➜ ~ </tspan><tspan class="cmd">cat role.txt</tspan></text>
  <text x="56" y="214" class="mono o2"><tspan class="accent">Software Analyst</tspan><tspan class="out"> · </tspan><tspan class="kw">Java Backend Engineer</tspan><tspan class="out"> · Tallahassee, FL</tspan></text>

  <!-- line 3 -->
  <text x="56" y="258" class="mono t3"><tspan class="prompt">➜ ~ </tspan><tspan class="cmd">ls skills/</tspan></text>
  <text x="56" y="288" class="mono o3"><tspan class="kw">java</tspan><tspan class="out">  </tspan><tspan class="accent">spring-boot</tspan><tspan class="out">  </tspan><tspan class="kw">python</tspan><tspan class="out">  </tspan><tspan class="accent">sql</tspan><tspan class="out">  </tspan><tspan class="kw">django</tspan><tspan class="out">  </tspan><tspan class="accent">kafka</tspan><tspan class="out">  </tspan><tspan class="kw">redis</tspan><tspan class="out">  </tspan><tspan class="accent">power-bi</tspan></text>

  <!-- cursor -->
  <rect x="56" y="298" width="11" height="19" fill="#22D3EE" class="cursor"/>
</svg>
